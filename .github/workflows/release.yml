name: Release

# Push a tag like v1.2.0 to build both architectures and publish a GitHub release with the zips and installers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test (Core)
        run: dotnet test tests/PdfReader.Core.Tests -c Release

      - name: Publish x64 and ARM64
        shell: pwsh
        run: ./build/publish.ps1 -Version "$($env:GITHUB_REF_NAME.TrimStart('v'))"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = @"
          ## Downloads

          | Device | Installer (recommended) | Portable zip |
          | --- | --- | --- |
          | Intel / AMD PCs (x64) | ``LeafSide-$version-win-x64.msi`` | ``LeafSide-$version-win-x64.zip`` |
          | Windows on Arm (Surface with Snapdragon, other ARM64 PCs) | ``LeafSide-$version-win-arm64.msi`` | ``LeafSide-$version-win-arm64.zip`` |

          **Installer:** double-click the ``.msi``. It installs for your user only (no administrator rights), adds a
          Start menu entry and LeafSide to *Open with*, and can be removed from Settings > Apps.
          **Zip:** extract the whole zip and run ``LeafSide.exe``. Neither needs the .NET runtime.
          The app is not code-signed, so SmartScreen may ask you to confirm (More info > Run anyway).
          "@
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts/*.zip, artifacts/*.msi).FullName `
            --title "LeafSide $version" --notes $notes --generate-notes
