name: Release

# Push a tag like v1.2.0 to build both architectures and publish a GitHub release with the zips.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test (Core)
        run: dotnet test tests/PdfReader.Core.Tests -c Release

      - name: Publish x64 and ARM64
        shell: pwsh
        run: ./build/publish.ps1 -Version "$($env:GITHUB_REF_NAME.TrimStart('v'))"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = @"
          ## Downloads

          | Device | File |
          | --- | --- |
          | ARM64 (Surface Pro X / Surface with Snapdragon, other Windows on Arm) | ``PdfReader-$version-win-arm64.zip`` |
          | x64 (Intel / AMD) | ``PdfReader-$version-win-x64.zip`` |

          Extract the whole zip and run ``PdfReader.exe``. No installation or .NET runtime needed.
          The app is not code-signed, so SmartScreen may ask you to confirm (More info > Run anyway).
          "@
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts/*.zip).FullName `
            --title "PDF Reader $version" --notes $notes --generate-notes
