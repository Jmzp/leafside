name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test (Core)
        run: dotnet test tests/PdfReader.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Build app (x64)
        run: dotnet build src/PdfReader.App -c Release -p:Platform=x64

      - name: Build app (ARM64)
        run: dotnet build src/PdfReader.App -c Release -p:Platform=ARM64
